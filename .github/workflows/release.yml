name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    # Reusable build-only verify defined in the cogworks repo. Asserts the
    # produced zip has its externals populated (catches the alpha6 incident
    # where Libs/Cogworks-1.0/Cogworks-1.0.xml shipped missing) plus TOC/XML
    # reference integrity and zip non-triviality. See cogworks COG-27.
    uses: gezmodean-wow/cogworks/.github/workflows/verify-package.yml@main
    secrets: inherit

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release type
        id: release_type
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "${TAG,,}" == *"alpha"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "${TAG,,}" == *"beta"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          fi
          echo "Release channel: $(cat "$GITHUB_OUTPUT" | grep channel | cut -d= -f2)"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          skipIfReleaseExists: true
          prerelease: ${{ steps.release_type.outputs.prerelease }}

      - name: Package and Publish
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
